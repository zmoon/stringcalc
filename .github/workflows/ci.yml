name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual triggering
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for hatch-vcs

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --all-extras --group test --group data

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & test frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Build widget bundle, standalone web app, and distributions
        run: |
          uv run python scripts/build_web.py --source local
          mkdir -p dist
          cp frontend/dist/app/wheels/stringcalc-*.whl dist/
          uv build --sdist --out-dir dist

      - name: Verify built wheel and sdist contents
        run: |
          uv run python -c "
          import glob, os, pathlib, tarfile, zipfile
          assert pathlib.Path('stringcalc/widget/_bundle.js').is_file()
          assert pathlib.Path('stringcalc/_web/index.html').is_file()

          wheels = sorted(glob.glob('dist/stringcalc-*.whl'))
          sdists = sorted(glob.glob('dist/stringcalc-*.tar.gz'))
          assert len(wheels) == 1, f'expected 1 wheel, got {wheels}'
          assert len(sdists) == 1, f'expected 1 sdist, got {sdists}'

          required = {
              'stringcalc/widget/_bundle.js',
              'stringcalc/_web/index.html',
              'stringcalc/_web/misc.html',
              'stringcalc/data/presets.json',
          }
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
              assert required <= names, f'wheel missing {required - names}'
              assert not any(n.endswith('.whl') for n in names), 'nested wheel in wheel'

          with tarfile.open(sdists[0], 'r:gz') as tf:
              rel = {'/'.join(m.name.split('/')[1:]) for m in tf.getmembers()}
              assert required <= rel, f'sdist missing {required - rel}'
              assert not any(n.endswith('.whl') for n in rel), 'nested wheel in sdist'

          if os.environ.get('GITHUB_REF', '').startswith('refs/tags/v'):
              for p in (wheels[0], sdists[0]):
                  name = pathlib.Path(p).name
                  assert '.dev' not in name and '+' not in name, f'unexpected non-release version on tag: {p}'
          "

      - name: Check distribution metadata with twine
        run: uvx twine check --strict dist/*

      - name: Smoke test installed wheel
        run: |
          whl="$(realpath dist/stringcalc-*.whl)"
          uv run --isolated --no-project --with "${whl}[cli,widget]" --directory /tmp python -c "
          import subprocess, stringcalc
          from stringcalc._server import create_server
          from stringcalc.widget import GaugeSuggestWidget

          assert 'site-packages' in (stringcalc.__file__ or ''), stringcalc.__file__
          subprocess.run(['stringcalc', '--version'], check=True)
          w = GaugeSuggestWidget()
          assert w._esm and w.results['error'] is None
          s = create_server()
          s.server_close()
          "

      - name: Test with pytest
        run: uv run pytest -v

      - name: Docstring doctest
        run: uv run pytest --doctest-modules stringcalc -v

      - name: Test code blocks
        run: uv run pytest --codeblocks README.md docs -v

      - name: Check type annotations
        run: uv run mypy --non-interactive .

      - name: Check data prep scripts still work
        run: |
          # Copy to temp location
          mkdir -p stringcalc/data/_orig
          cp stringcalc/data/*.csv stringcalc/data/_orig/

          # Run scripts
          for f in data/*.py; do
            if [ $(basename $f) == "daddario_extract.py" ]; then continue; fi
            uv run python $f
          done

          # Compare results to those in the repo
          cd stringcalc/data
          rc=0
          for f in *.csv; do
            echo $f
            cmp _orig/$f $f || rc=$?
          done
          exit $rc

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/app

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group test

      - name: Test with pytest
        run: uv run pytest -v

      - name: Docstring doctest
        if: matrix.python-version != '3.11'
        run: uv run pytest --doctest-modules stringcalc -v

  publish-pypi:
    needs: [build-test, compat]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stringcalc
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-pages:
    needs: [build-test, compat]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
