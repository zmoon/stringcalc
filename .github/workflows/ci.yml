name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual triggering
  schedule:
    - cron: "0 12 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --all-extras --group test --group data

      - name: Test with pytest
        run: uv run pytest -v

      - name: Docstring doctest
        if: matrix.python-version != '3.11'
        run: uv run pytest --doctest-modules stringcalc -v

      - name: Test code blocks
        run: uv run pytest --codeblocks README.md docs -v

      - name: Check type annotations
        run: |
          uv run mypy --non-interactive .

      - name: Check data prep scripts still work
        run: |
          # Copy to temp location
          mkdir -p stringcalc/data/_orig
          cp stringcalc/data/*.csv stringcalc/data/_orig/

          # Run scripts
          for f in data/*.py; do
            if [ $(basename $f) == "daddario_extract.py" ]; then continue; fi
            uv run python $f
          done

          # Compare results to those in the repo
          cd stringcalc/data
          rc=0
          for f in *.csv; do
            echo $f
            cmp _orig/$f $f || rc=$?
          done
          exit $rc

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --all-extras --group test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & test frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Build widget bundle and standalone web app
        run: uv run python scripts/build_web.py --source local

      - name: Verify widget bundle is built and packaged in wheel
        run: |
          uv run python -c "
          import glob, pathlib, zipfile
          assert pathlib.Path('stringcalc/widget/_bundle.js').is_file()
          wheels = sorted(glob.glob('frontend/dist/app/wheels/stringcalc-*.whl'))
          assert wheels, 'no wheel built'
          with zipfile.ZipFile(wheels[-1]) as z:
              assert 'stringcalc/widget/_bundle.js' in z.namelist()
              assert 'stringcalc/data/presets.json' in z.namelist()
          "

      - name: Test Python widgets and app service
        run: uv run pytest tests/test_app.py tests/test_widget.py -v

      - name: Upload built standalone app
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: frontend/dist/app
          retention-days: 1
